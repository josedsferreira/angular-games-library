
<main class="main">

  <header class="navbar flex items-center bg-slate-200 dark:bg-slate-900 dark:text-neutral-300">

    <a 
    [routerLink]="['/']"
    class="block">
      <app-logo></app-logo>
    </a>

    <h1 class="text-xl font-bold mx-2 whitespace-nowrap">Game Library</h1>

    <nav class="navbar py-0 flex items-center">
      <a 
      [routerLink]="['/']"
      class="btn btn-ghost mt-1">Home</a>

      <a 
      [routerLink]="['/add-game']"
      class="btn btn-ghost mt-1">Add new game</a>
    </nav>

    <section >
      <form class="mx-2">
        <label class="input input-bordered flex items-center gap-2">
          <input type="text" class="grow" placeholder="Search" />
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 16 16"
            fill="currentColor"
            class="h-4 w-4 opacity-70">
            <path
              fill-rule="evenodd"
              d="M9.965 11.026a5 5 0 1 1 1.06-1.06l2.755 2.754a.75.75 0 1 1-1.06 1.06l-2.755-2.754ZM10.5 7a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0Z"
              clip-rule="evenodd" />
          </svg>
        </label>
        <!-- <button class="btn btn-primary" type="submit">Search</button> -->
      </form>
    </section>

  </header>

  <section>
    <router-outlet></router-outlet>
  </section>

</main>
